name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
      - name: Unit tests
        run: go test -race ./...
      - name: Every release target builds
        run: |
          for t in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./... || { echo "::error::go vet fails for $t"; exit 1; }
          done

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
        working-directory: npm

  docker:
    # Runtime and builder against a real Docker daemon, with the pinned Railpack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Use the containerd image store (Railpack builds need it)
        run: |
          f=/etc/docker/daemon.json
          { [ -s "$f" ] && cat "$f" || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f" && sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter
      - name: Install Railpack
        run: |
          curl -fsSL -o /tmp/railpack.tgz https://github.com/railwayapp/railpack/releases/download/v0.40.1/railpack-v0.40.1-x86_64-unknown-linux-musl.tar.gz
          echo "2842de93e68713af9037e0bc0a398d7da78f3b96aa4804303a638db2bc69bd30  /tmp/railpack.tgz" | sha256sum -c
          sudo tar -xzf /tmp/railpack.tgz -C /usr/local/bin railpack
      - run: go test -count=1 ./internal/docker ./internal/build
        env:
          KAYLY_DOCKER_TESTS: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh test/e2e/e2e.sh

  e2e:
    # A real install, deploy, a daemon crash at every pipeline step, rollback, and an upgrade from
    # the previous release with zero failed requests (test/e2e/e2e.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: |
          (cd web && npm ci && npm run build)
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=v0.0.0-e2e" -o kayly ./cmd/kayly
      - name: Use the containerd image store (Railpack builds need it)
        run: |
          f=/etc/docker/daemon.json
          { [ -s "$f" ] && cat "$f" || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f" && sudo systemctl restart docker
      - name: Fetch the previous release
        # The newest published release, checked against its checksums; this build stands in
        # until the first release exists.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'kayly-linux-amd64' --pattern checksums.txt --dir previous; then
            (cd previous && sha256sum --check --ignore-missing checksums.txt)
            chmod +x previous/kayly-linux-amd64
            echo "PREVIOUS=previous/kayly-linux-amd64" >>"$GITHUB_ENV"
          else
            echo "PREVIOUS=kayly" >>"$GITHUB_ENV"
          fi
      - run: sudo bash test/e2e/e2e.sh kayly "$PREVIOUS"
