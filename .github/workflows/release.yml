name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Build
        # Linux runs the daemon; macOS and Windows builds are for the CLI (and the npm package).
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=; [ "$os" = windows ] && ext=.exe
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/kayly-$os-$arch$ext ./cmd/kayly
            done
          done
          (cd dist && sha256sum kayly-* > checksums.txt)
      - name: Sign
        # install.sh and `kayly upgrade` install a binary only when checksums.txt carries a valid
        # signature by this key; its public half is internal/upgrade/release.pub.
        env:
          KAYLY_SIGNING_KEY: ${{ secrets.KAYLY_SIGNING_KEY }}
        run: |
          [ -n "$KAYLY_SIGNING_KEY" ] || { echo "::error::the KAYLY_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KAYLY_SIGNING_KEY" >"$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/checksums.txt -out dist/checksums.txt.sig
          openssl pkeyutl -verify -pubin -inkey internal/upgrade/release.pub -rawin -in dist/checksums.txt -sigfile dist/checksums.txt.sig
      - name: Release notes
        # The tag's section of CHANGELOG.md.
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md >notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section [${GITHUB_REF_NAME#v}]"; exit 1; }
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    # The npm package downloads this release's binaries, so it goes out after them. A separate
    # job, so a failed publish can be re-run without re-creating the release.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::the NPM_TOKEN secret is not set"; exit 1; }
          npm test
          version="${GITHUB_REF_NAME#v}"
          # The package's version must be the release's: the launcher downloads that release's
          # binary, so a version published without one fails on first run. The version comes from
          # the tag, never from a hand-edited npm/package.json; if it is already on npm (say, a
          # release was re-tagged), there is nothing left to publish.
          if npm view "kayly@$version" version >/dev/null 2>&1; then
            echo "::notice::kayly@$version is already published; skipping npm publish"
            exit 0
          fi
          npm version "$version" --no-git-tag-version
          npm publish --provenance --access public
